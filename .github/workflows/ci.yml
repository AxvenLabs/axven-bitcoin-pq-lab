name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run deterministic model tests
        run: python -m unittest discover -s tests -v
      - name: Export deterministic vectors
        run: |
          python -m scripts.export_vectors --output /tmp/test-vectors-v1.json
          python -m json.tool /tmp/test-vectors-v1.json >/dev/null
      - name: Export migration failure matrix
        run: |
          python -m scripts.migration_matrix --output /tmp/migration-matrix-v1.json
          python -m json.tool /tmp/migration-matrix-v1.json >/dev/null
      - name: Verify pinned Bitcoin Core upstream identity
        run: python -m scripts.verify_upstream_pin >/tmp/upstream-pin.json
      - name: Benchmark smoke test
        run: python -m scripts.benchmark_model --iterations 100 --rounds 2 >/tmp/model-benchmark.json
      - name: Measure scheme-neutral opaque authorization material sizes
        run: |
          python -m scripts.benchmark_auth_material_size >/tmp/opaque-auth-material-size.json
          python -m json.tool /tmp/opaque-auth-material-size.json >/dev/null

  mldsa-candidate-benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned ML-DSA benchmark backend
        run: python -m pip install --disable-pip-version-check cryptography==48.0.0
      - name: Run ML-DSA candidate regression tests
        run: python -m unittest tests.test_benchmark_mldsa_candidates tests.test_mldsa_negative_oracle tests.test_regtest_mldsa_composition tests.test_regtest_benchmark_evidence -v
      - name: Run named ML-DSA candidate comparison
        run: |
          python -m scripts.benchmark_mldsa_candidates --iterations 25 | tee /tmp/mldsa-candidates.json
          python -m json.tool /tmp/mldsa-candidates.json >/dev/null
          python - <<'PY'
          import json
          import math
          import statistics

          report = json.load(open('/tmp/mldsa-candidates.json'))
          assert report['schema_version'] == 3
          assert report['research_only'] is True
          assert report['endorsed_by_bitcoin_core'] is False
          assert report['mainnet_intended'] is False
          assert report['parameter_set_selected'] is False
          assert report['deployment_winner_selected'] is False
          assert report['bitcoin_core_modified'] is False
          assert report['bitcoin_script_semantics_selected'] is False
          assert report['consensus_change_selected'] is False
          assert report['raw_sample_evidence'] is True
          assert report['percentile_method'] == 'nearest-rank'
          assert report['cryptography_version'] == '48.0.0'
          rows = {row['candidate']: row for row in report['candidates']}
          assert set(rows) == {'ML-DSA-44', 'ML-DSA-65', 'ML-DSA-87'}
          expected = {
              'ML-DSA-44': (1312, 2420),
              'ML-DSA-65': (1952, 3309),
              'ML-DSA-87': (2592, 4627),
          }
          for name, row in rows.items():
              assert (row['public_key_bytes'], row['signature_bytes']) == expected[name]
              wall = row['verify_wall_samples_ns']
              cpu = row['verify_cpu_samples_ns']
              assert len(wall) == row['iterations'] == 25
              assert len(cpu) == row['iterations'] == 25
              assert all(type(v) is int and v > 0 for v in wall)
              assert all(type(v) is int and v > 0 for v in cpu)
              wall_sorted = sorted(wall)
              cpu_sorted = sorted(cpu)
              rank = max(1, math.ceil(0.95 * row['iterations']))
              assert row['verify_wall_median_ns'] == int(statistics.median(wall))
              assert row['verify_wall_p95_ns'] == wall_sorted[rank - 1]
              assert row['verify_wall_min_ns'] == min(wall)
              assert row['verify_wall_max_ns'] == max(wall)
              assert row['verify_cpu_median_ns'] == int(statistics.median(cpu))
              assert row['verify_cpu_p95_ns'] == cpu_sorted[rank - 1]
              assert row['verify_cpu_min_ns'] == min(cpu)
              assert row['verify_cpu_max_ns'] == max(cpu)
              assert row['python_peak_alloc_bytes'] >= 0
              assert row['process_max_rss_bytes'] > 0
              assert row['correctness_oracle']['valid_signature_accepted'] is True
              assert row['correctness_oracle']['altered_message_rejected'] is True
          PY
      - name: Emit canonical raw benchmark evidence
        run: |
          python -m scripts.regtest_benchmark_evidence --iterations 25 | tee /tmp/regtest-benchmark-evidence.json
          python -m json.tool /tmp/regtest-benchmark-evidence.json >/dev/null

  vanilla-regtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Bitcoin Core build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkgconf libevent-dev libboost-dev libsqlite3-dev
      - name: Verify pinned upstream identity
        run: python -m scripts.verify_upstream_pin >/tmp/upstream-pin.json
      - name: Fetch pinned Bitcoin Core source
        run: |
          git init --quiet /tmp/bitcoin-core
          git -C /tmp/bitcoin-core remote add origin https://github.com/bitcoin/bitcoin.git
          git -C /tmp/bitcoin-core fetch --quiet --depth=1 origin refs/tags/v31.1:refs/tags/v31.1
          git -C /tmp/bitcoin-core checkout --quiet --detach v31.1^{}
          test "$(git -C /tmp/bitcoin-core rev-parse HEAD)" = "$(python -c 'import json; print(json.load(open("upstream/bitcoin-core.json"))["commit_sha"])')"
      - name: Build vanilla Bitcoin Core
        run: |
          cmake -S /tmp/bitcoin-core -B /tmp/bitcoin-core/build \
            -DBUILD_GUI=OFF \
            -DENABLE_IPC=OFF \
            -DBUILD_BENCH=OFF \
            -DBUILD_TESTS=OFF
          cmake --build /tmp/bitcoin-core/build -j2
      - name: Run isolated vanilla regtest baseline
        run: bash scripts/run_vanilla_regtest_baseline.sh /tmp/bitcoin-core/build/bin | tee /tmp/vanilla-regtest-baseline.json
      - name: Run lab with experiment explicitly off
        run: python -m scripts.run_regtest_lab --mode off --bin-dir /tmp/bitcoin-core/build/bin | tee /tmp/experiment-off-regtest-baseline.json
      - name: Require experiment-off equivalence
        run: python -m scripts.compare_regtest_baselines /tmp/vanilla-regtest-baseline.json /tmp/experiment-off-regtest-baseline.json
      - name: Measure vanilla transaction structure
        run: |
          bash scripts/run_vanilla_transaction_benchmark.sh /tmp/bitcoin-core/build/bin | tee /tmp/vanilla-transaction-metrics.json
          python -m json.tool /tmp/vanilla-transaction-metrics.json >/dev/null
      - name: Run decision-gated real regtest preflight
        run: |
          bash scripts/run_regtest_demo_preflight.sh /tmp/bitcoin-core/build/bin | tee /tmp/regtest-demo-preflight.json
          python -m json.tool /tmp/regtest-demo-preflight.json >/dev/null
          python - <<'PY'
          import json
          report = json.load(open('/tmp/regtest-demo-preflight.json'))
          assert report['research_only'] is True
          assert report['bitcoin_core_modified'] is False
          assert report['experiment_on_status'] == 'blocked_pending_explicit_security_decisions'
          assert report['scheme_selected'] is False
          assert report['hybrid_semantics_selected'] is False
          PY
