name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run deterministic model tests
        run: python -m unittest discover -s tests -v
      - name: Export deterministic vectors
        run: |
          python -m scripts.export_vectors --output /tmp/test-vectors-v1.json
          python -m json.tool /tmp/test-vectors-v1.json >/dev/null
      - name: Export migration failure matrix
        run: |
          python -m scripts.migration_matrix --output /tmp/migration-matrix-v1.json
          python -m json.tool /tmp/migration-matrix-v1.json >/dev/null
      - name: Verify pinned Bitcoin Core upstream identity
        run: python -m scripts.verify_upstream_pin >/tmp/upstream-pin.json
      - name: Benchmark smoke test
        run: python -m scripts.benchmark_model --iterations 100 --rounds 2 >/tmp/model-benchmark.json
