name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run deterministic model tests
        run: python -m unittest discover -s tests -v
      - name: Export deterministic vectors
        run: |
          python scripts/export_vectors.py --output /tmp/test-vectors-v1.json
          python -m json.tool /tmp/test-vectors-v1.json >/dev/null
      - name: Benchmark smoke test
        run: python scripts/benchmark_model.py --iterations 100 --rounds 2 >/tmp/model-benchmark.json
