name: Phase 3 replay receipt

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  replay-receipt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned ML-DSA backend
        run: python -m pip install --disable-pip-version-check cryptography==48.0.0
      - name: Run Phase 3 replay and receipt fail-closed regressions
        run: |
          python -m unittest \
            tests.test_replay_regtest_e2e_evidence \
            tests.test_validate_replay_receipt \
            -v
